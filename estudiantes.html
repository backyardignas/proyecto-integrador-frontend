<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Estudiantes - UniOriente</title>
    <link rel="icon" type="image/png" href="IMG/librito.png">
    <link rel="stylesheet" href="CSS/estudiantes.css">
</head>
<body>

    <header class="navbar">
        <div class="logo-container">
            <div class="logo-circular">
                <img src="IMG/logo.png" alt="Logo">
            </div>
            <h1>Uni<span>Oriente</span></h1>
        </div>
        <div class="user-info">
            <span id="saludo-usuario">Cargando...</span>
            <a href="Main.html" class="btn-back">Cerrar Sesión</a>
        </div>
    </header>

    <main class="container">

        <!-- Formulario: bloqueado por JS para el rol estudiante -->
        <section class="form-section">
            <h2>Mis Datos</h2>
            <form id="formulario-registro">
                <input type="hidden" id="indice-edicion">

                <div class="input-group">
                    <label>Nombre Completo</label>
                    <input type="text" id="nombre" placeholder="Ej: Alex Monroy">
                </div>

                <div class="input-group">
                    <label>Carrera</label>
                    <select id="carrera">
                        <option value="Ingeniería de Sistemas">Ingeniería de Sistemas</option>
                        <option value="Derecho">Derecho</option>
                        <option value="Administración">Administración</option>
                        <option value="Diseño Gráfico">Diseño Gráfico</option>
                    </select>
                </div>

                <div class="grupo-entradas-notas">
                    <div class="casilla-nota">
                        <label>Nota 1 (30%)</label>
                        <input type="number" id="nota1" min="0" max="5" step="0.1" placeholder="0.0">
                    </div>
                    <div class="casilla-nota">
                        <label>Nota 2 (30%)</label>
                        <input type="number" id="nota2" min="0" max="5" step="0.1" placeholder="0.0">
                    </div>
                    <div class="casilla-nota">
                        <label>Nota 3 (40%)</label>
                        <input type="number" id="nota3" min="0" max="5" step="0.1" placeholder="0.0">
                    </div>
                </div>

                <!-- El JS desactiva este botón y cambia su texto -->
                <button type="submit" id="btn-guardar">Guardar Registro</button>
            </form>

            <!-- Aviso visible de solo lectura -->
            <div class="aviso-readonly">
                <span>&#128274;</span> Las notas y datos son gestionados por tu profesor.
            </div>
        </section>

        <section class="list-section">
            <h2>Estudiantes Registrados</h2>
            <div id="lista-estudiantes" class="grid-estudiantes">
                <!-- Tarjetas inyectadas por JS — sin botones de editar/borrar -->
            </div>
        </section>

    </main>

    <script src="JS/estudiantes.js"></script>
</body>
</html>
