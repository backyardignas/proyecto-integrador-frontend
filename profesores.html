<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Profesores</title>
    <!-- Bootstrap 5 CSS para activar tus clases de tablas y tarjetas -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons por si deseas agregar iconos más adelante -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="CSS/profesores.css">
    <link rel="icon" type="image/png" href="IMG/librito.png">
</head>
<body>

    <header class="header-principal">
        <nav class="navegador-custom d-flex justify-content-between align-items-center">
            <div class="logo-nav">
                <img src="IMG/Logo.png" alt="Logo" onerror="this.src='https://via.placeholder.com/40?text=U'">
            </div>
            <div class="nav-links">
                <a href="Main.html" class="nav-link">Inicio</a>
                <a href="estudiantes.html" class="nav-link">Estudiantes</a>
                <a href="profesores.html" class="nav-link active">Profesores</a>
            </div>
        </nav>
    </header>

    <div class="container my-5">
        <!-- Saludo dinámico controlado por JS -->
        <h5 id="texto-bienvenida" class="text-muted mb-3">Cargando usuario...</h5>
        <h2 class="mb-4 fw-bold" style="color: var(--texto-oscuro);">Gestión de Profesores</h2>
        
        <div class="row g-4">
            <!-- Columna del Formulario -->
            <div class="col-md-4">
                <div class="card p-4">
                    <h3 id="form-title">Profesor</h3>
                    <form id="professor-form" onsubmit="event.preventDefault(); guardar();">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre Completo</label>
                            <input type="text" id="nombre" class="form-control" placeholder="Ej. Diego Giraldo" required>
                        </div>
                        <div class="mb-3">
                            <label for="materia" class="form-label">Materia / Asignatura</label>
                            <input type="text" id="materia" class="form-control" placeholder="Ej. FrontEnd" required>
                        </div>
                        <div class="mb-3">
                            <label for="horario" class="form-label">Horario</label>
                            <input type="text" id="horario" class="form-control" placeholder="Ej. 06:00 PM" required>
                        </div>
                        <button type="submit" id="btn-guardar" class="btn btn-primary w-100">Guardar Datos</button>
                    </form>
                </div>
            </div>

            <!-- Columna de la Tabla -->
            <div class="col-md-8">
                <div class="card p-4">
                    <h3>Listado de Profesores</h3>
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Nombre</th>
                                    <th>Materia</th>
                                    <th>Horario</th>
                                    <th class="text-end">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="lista">
                                <!-- Filas renderizadas dinámicamente por JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="JS/profesores.js"></script>
</body>
</html>
