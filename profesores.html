<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Profesores - UniOriente</title>
    <link rel="icon" type="image/png" href="IMG/librito.png">
    <link rel="stylesheet" href="CSS/profesores.css">
</head>
<body>

    <header class="navbar">
        <div class="logo-container">
            <div class="logo-circular">
                <img src="IMG/logo.png" alt="Logo">
            </div>
            <h1>Uni<span>Oriente</span></h1>
        </div>
        <div class="user-info">
            <span id="saludo-usuario">Cargando...</span>
            <a href="Main.html" class="btn-back">Cerrar Sesión</a>
        </div>
    </header>

    <main class="container">

        <!-- Columna del Formulario -->
        <section class="form-section">
            <h2 id="form-titulo">Registrar Profesor</h2>
            <form id="professor-form">
                <input type="hidden" id="indice-edicion">

                <div class="input-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" placeholder="Ej: Diego Giraldo" required>
                </div>

                <div class="input-group">
                    <label for="materia">Materia / Asignatura</label>
                    <input type="text" id="materia" placeholder="Ej: FrontEnd" required>
                </div>

                <div class="input-group">
                    <label for="horario">Horario</label>
                    <input type="text" id="horario" placeholder="Ej: 06:00 PM" required>
                </div>

                <button type="submit" id="btn-guardar">Guardar Datos</button>
            </form>

            <!-- Separador para la sección de notas de estudiantes -->
            <div class="separador-seccion">
                <span>Gestión de Notas</span>
            </div>

            <h2>Asignar Nota a Estudiante</h2>
            <form id="form-notas">
                <div class="input-group">
                    <label for="sel-estudiante">Seleccionar Estudiante</label>
                    <select id="sel-estudiante" required>
                        <option value="">-- Selecciona un estudiante --</option>
                    </select>
                </div>

                <div class="grupo-entradas-notas">
                    <div class="casilla-nota">
                        <label>Nota 1 (30%)</label>
                        <input type="number" id="nota1-profe" min="0" max="5" step="0.1" placeholder="0.0" required>
                    </div>
                    <div class="casilla-nota">
                        <label>Nota 2 (30%)</label>
                        <input type="number" id="nota2-profe" min="0" max="5" step="0.1" placeholder="0.0" required>
                    </div>
                    <div class="casilla-nota">
                        <label>Nota 3 (40%)</label>
                        <input type="number" id="nota3-profe" min="0" max="5" step="0.1" placeholder="0.0" required>
                    </div>
                </div>

                <button type="submit" id="btn-guardar-notas">Guardar Notas</button>
            </form>
        </section>

        <!-- Columna de la Tabla de Profesores y Estudiantes -->
        <section class="list-section">
            <h2>Profesores Registrados</h2>
            <div class="tabla-responsive">
                <table class="tabla-profesores">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Materia</th>
                            <th>Horario</th>
                            <th class="col-acciones">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="lista-profesores">
                        <!-- Filas renderizadas dinámicamente -->
                    </tbody>
                </table>
            </div>

            <h2 style="margin-top: 35px;">Estudiantes y sus Notas</h2>
            <div id="lista-estudiantes-profe" class="grid-estudiantes">
                <!-- Tarjetas de estudiantes con notas editables por el profesor -->
            </div>
        </section>

    </main>

    <script src="JS/profesores.js"></script>
</body>
</html>
